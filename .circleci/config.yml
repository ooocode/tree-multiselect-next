version: "2.1"
orbs:
  browser-tools: circleci/browser-tools@1.4.0
jobs:
  build:
    docker:
      - image: cimg/node:24.0-browsers
    working_directory: ~/tree-multiselect
    steps:
      # The Vitest browser provider is configured with `channel: 'chrome'`,
      # so it drives the Chrome installed here rather than a bundled Chromium.
      - browser-tools/install-chrome
      - checkout
      - restore_cache:
          keys:
            - v1-dependencies-{{ checksum "package.json" }}
            # fallback to using the latest cache if no exact match is found
            - v1-dependencies-
      - run: npm ci
      - save_cache:
          paths:
            - node_modules
          key: v1-dependencies-{{ checksum "package.json" }}
      - run: npm test
